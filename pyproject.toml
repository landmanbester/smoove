# PEP 621 compliant project metadata
[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"

[project]
name = "smoove"
version = "0.0.1"
description = "Miscellaneous fast smoothing utilities"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["smoothing", "kalman-filter", "gaussian-process", "numerical", "signal-processing"]
authors = [
    {name = "Landman Bester", email = "lbester@sarao.ac.za"},
]
maintainers = [
    {name = "Landman Bester", email = "lbester@sarao.ac.za"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "numba>=0.55",
]


[project.urls]
Homepage = "https://github.com/landmanbester/smoove"
Repository = "https://github.com/landmanbester/smoove"
Issues = "https://github.com/landmanbester/smoove/issues"
Changelog = "https://github.com/landmanbester/smoove/releases"

[dependency-groups]
dev = [
    "pytest>=6.2.2",
    "ruff>=0.1.0",
    "pre-commit>=4.0.0",
]
test = [
    "pytest>=6.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable names (l, I are standard in scientific code)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
